<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kart workshop</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #5b6475;
      --accent: #d6322b;
      --border: #dfe3ea;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1218;
        --card: #181d27;
        --text: #eef1f6;
        --muted: #9aa4b5;
        --accent: #ff6b66;
        --border: #2a3140;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    header { text-align: center; margin-bottom: 40px; }
    h1 { font-size: 2.25rem; margin: 0 0 12px; }
    header p { color: var(--muted); margin: 0 auto; max-width: 560px; }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card h2 { margin: 0 0 16px; font-size: 1.5rem; }
    .card img {
      width: 200px;
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
      margin-bottom: 20px;
    }
    .play {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }
    .play:hover, .play:focus-visible { filter: brightness(1.08); }
    .card .hint { color: var(--muted); font-size: 0.9rem; margin: 0 0 16px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Kart workshop</h1>
      <p>Three racing kart games, each built by a different Claude model. Scan a QR code or pick a game to play in your browser.</p>
    </header>

    <section class="games">
      <article class="card">
        <h2>Haiku</h2>
        <p class="hint">Scan to play on your phone</p>
        <img src="qr/kart-haiku-qr.png" alt="QR code linking to the Haiku kart game" width="200" height="200">
        <a class="play" href="haiku/">Play Haiku</a>
      </article>

      <article class="card">
        <h2>Sonnet</h2>
        <p class="hint">Scan to play on your phone</p>
        <img src="qr/kart-sonnet-qr.png" alt="QR code linking to the Sonnet kart game" width="200" height="200">
        <a class="play" href="sonnet/">Play Sonnet</a>
      </article>

      <article class="card">
        <h2>Opus</h2>
        <p class="hint">Scan to play on your phone</p>
        <img src="qr/kart-opus-qr.png" alt="QR code linking to the Opus kart game" width="200" height="200">
        <a class="play" href="opus/">Play Opus</a>
      </article>
    </section>
  </main>
</body>
</html>
