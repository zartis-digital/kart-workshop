    ? [['LEFT THUMB', 'Drag left / right to steer'], ['GAS  ·  BRAKE', 'Accelerate  ·  Brake / reverse'],
      ['DRIFT', 'Hold while turning, release to boost'], ['II', 'Pause']]
    : [['↑ / W', 'Accelerate'], ['↓ / S', 'Brake / reverse'], ['← → / A D', 'Steer'],
      ['SPACE', 'Drift (release for boost)'], ['P  ·  R  ·  M', 'Pause  ·  Restart  ·  Mute']];
  const rowH = compact ? 30 : 33, pad = compact ? 14 : 17.5, keyX = compact ? 180 : 160;
  const w = compact ? 500 : 440, h = rows.length * rowH + pad * 2, x = cx - w / 2, y = ty + (compact ? 76 : 96);
  panel(x, y, w, h);
  rows.forEach(([key, label], i) => {
    const ry = y + pad + rowH / 2 + i * rowH;
    font(15, 800);
    text(key, x + keyX, ry, '#ffd84a', 'right', 'middle');
    font(15, 600);
    text(label, x + keyX + 22, ry, '#ffffff', 'left', 'middle');
  });

  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(game.time * 5);
  font(26, 900, true);
  text(compact ? 'TAP TO RACE' : 'PRESS ENTER TO RACE', cx, y + h + (compact ? 40 : 48), '#ffffff', 'center', 'middle');
  ctx.globalAlpha = 1;
  if (game.record !== null) {
    font(14, 600);
    text('Lap record: ' + fmtTime(game.record), cx, y + h + (compact ? 72 : 84), DIM, 'center', 'middle');
  }
}

function drawResults(vw, vh) {
  ctx.fillStyle = 'rgba(5,8,16,0.55)';
  ctx.fillRect(0, 0, vw, vh);
  const rowH = touchMode ? 36 : 46, w = 620, h = 170 + rowH * game.order.length + (touchMode ? 96 : 56);
  const x = (vw - w) / 2, y = Math.max(layout.t, (vh - h) / 2);
  panel(x, y, w, h);
  const p = game.player;
  font(14, 800);
  text('RACE RESULTS', x + w / 2, y + 30, DIM, 'center', 'middle');
  font(40, 900, true);
  text('YOU FINISHED ' + ordinal(p.place).toUpperCase() + '!', x + w / 2, y + 72, p.place === 1 ? '#ffd84a' : '#ffffff', 'center', 'middle');
  if (game.newRecord) {
    font(15, 800);
    text('NEW LAP RECORD  ' + fmtTime(game.record), x + w / 2, y + 108, '#ffd84a', 'center', 'middle');
  }

  const cPos = x + 44, cName = x + 104, cTotal = x + 440, cBest = x + w - 36;
  const hy = y + 142;
  font(11, 800);
  text('POS', cPos, hy, DIM, 'center', 'middle');
  text('DRIVER', cName, hy, DIM, 'left', 'middle');
  text('TOTAL TIME', cTotal, hy, DIM, 'right', 'middle');
  text('BEST LAP', cBest, hy, DIM, 'right', 'middle');
  game.order.forEach((k, i) => {
    const ry = y + 156 + i * rowH, my = ry + rowH / 2;
    if (k.isPlayer) {
      roundRect(x + 14, ry + 3, w - 28, rowH - 6, 8);
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fill();
    }
    font(22, 900, true);
    text(String(i + 1), cPos, my + 1, i === 0 ? '#ffd84a' : '#ffffff', 'center', 'middle');
    ctx.fillStyle = k.color;
    ctx.fillRect(cName, my - 9, 6, 18);
    font(18, 700);
    text(k.name, cName + 16, my + 1, '#ffffff', 'left', 'middle');
    font(17, 700, false, MONO);
    text(k.finished ? fmtTime(k.finishTime) : 'racing · L' + Math.min(k.lap + 1, LAPS) + '/' + LAPS,
      cTotal, my + 1, k.finished ? '#ffffff' : DIM, 'right', 'middle');
    text(fmtTime(k.bestLap), cBest, my + 1, '#7dffa8', 'right', 'middle');
  });
  const allDone = game.karts.every(k => k.finished);
  if (touchMode) {
    // A button, not "tap anywhere": a thumb still on GAS must not restart the race
    if (!allDone) {
      font(13, 700);
      text('others still on track…', x + w / 2, y + 170 + rowH * game.order.length, DIM, 'center', 'middle');
    }
    uiButton('again', x + w / 2 - 120, y + h - 70, 240, 52, 'RACE AGAIN', raceFromTap, '#ffd84a');
    return;
  }
  font(16, 800);
  text(allDone ? 'Press R to race again' : 'Press R to race again  ·  others still on track…',
    x + w / 2, y + h - 28, '#ffffff', 'center', 'middle');
}

function drawPause(vw, vh) {
  ctx.fillStyle = 'rgba(5,8,16,0.6)';
  ctx.fillRect(0, 0, vw, vh);
  font(64, 900, true);
  text('PAUSED', vw / 2, vh / 2 - (touchMode ? 56 : 20), '#ffffff', 'center', 'middle');
  if (touchMode) {
    const bw = 170, bh = 56, gap = 18, x0 = vw / 2 - (bw * 3 + gap * 2) / 2, by = vh / 2 + 4;
    uiButton('resume', x0, by, bw, bh, 'RESUME', togglePause, '#5dff7a');
    uiButton('restart', x0 + bw + gap, by, bw, bh, 'RESTART', raceFromTap);
    uiButton('sound', x0 + (bw + gap) * 2, by, bw, bh, audio.muted ? 'SOUND OFF' : 'SOUND ON', () => audio.toggleMute());
    return;
  }
  font(16, 700);
  text('P resume  ·  R restart  ·  M mute', vw / 2, vh / 2 + 34, 'rgba(255,255,255,0.8)', 'center', 'middle');
}

// =====================================================================
// MAIN LOOP
// =====================================================================
let lastFrame = 0, loopStarted = false, errorLogged = false;

function frame(now) {
  requestAnimationFrame(frame);
  let dt = lastFrame ? (now - lastFrame) / 1000 : 0;
  lastFrame = now;
  if (!(dt > 0)) dt = 0;
  dt = Math.min(dt, DT_MAX);              // clamp: no teleporting after a background tab
  try {
    if (!game.paused) update(dt);
    audio.update(dt);
    render();
  } catch (err) {
    if (!errorLogged) { errorLogged = true; console.error(err); }
  }
}

function init() {
  resize();
  buildPatterns();
  resetRace('title');
  // Listeners are attached exactly once; R only resets game state
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', onOrientationChange);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);   // iOS address bar
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', onBlur);
  document.addEventListener('visibilitychange', onVisibility);
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerCancel);
  canvas.addEventListener('touchend', () => audio.unlock(), { passive: true });
  canvas.addEventListener('contextmenu', e => e.preventDefault());       // long-press menu
  document.addEventListener('gesturestart', e => e.preventDefault());    // pinch zoom on older iOS
  if (!loopStarted) { loopStarted = true; requestAnimationFrame(frame); }
  canvas.focus();
}

init();
</script>
